# ─── AGGREGATE TARGETS ───────────────────────────────────────────────────────
# These are derived targets for compliance checks — do not edit manually.
asset_class_targets:
  equity_total: 52.0          # VTI + VEA + VWO (25+18+9)
  fixed_income_total: 31.0    # SGOV + SHY + VCIT + SCHP (8+5+10+8)
  real_estate_total: 7.0      # VNQ
  commodities_total: 5.0      # PDBC
  cash_total: 5.0             # CASH

geographic_targets:
  us_equity: 25.0             # VTI
  developed_international: 18.0  # VEA
  emerging_markets: 9.0       # VWO
  us_bonds: 31.0              # SGOV+SHY+VCIT+SCHP
  global_commodities: 5.0     # PDBC

# ─── REBALANCING RULES ───────────────────────────────────────────────────────
rebalancing:
  method: new_money_only         # Never sell to rebalance
  soft_band: 3.0                 # Flag for review
  hard_band: 5.0                 # Requires action on next contribution
  minimum_purchase_usd: 50.0     # Don't allocate less than $50 to any single ETF
  review_frequency: quarterly
